name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: vet
        run: go vet ./...
      - name: gofmt
        # Every Go file under agent/ is as gofmt writes it, except the
        # systray copy, which stays byte for byte upstream plus its patch
        # and is never formatted. Each file that is not becomes an
        # annotation with gofmt's diff (readable without a token).
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bad=$(find . -path ./third_party -prune -o -name '*.go' -print | sort | xargs gofmt -l)
          [ -z "$bad" ] && exit 0
          echo "::error title=gofmt::$(echo "$bad" | wc -l) file(s) not formatted"
          for f in $bad; do
            d=$(gofmt -d "$f" | head -80 || true) # gofmt -d exits 1 on a difference
            d=${d//'%'/'%25'}; d=${d//$'\r'/'%0D'}; d=${d//$'\n'/'%0A'}
            echo "::error file=agent/${f#./},title=gofmt::$d"
          done
          exit 1
      - name: gjs and a session bus
        # gjs runs the GNOME extension's view-model test; dbus-daemon gives
        # the tests that need a session bus (tools/fakepanel) their own.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q > "$RUNNER_TEMP/apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q gjs dbus >> "$RUNNER_TEMP/apt.log" 2>&1 ||
            { tail -5 "$RUNNER_TEMP/apt.log" | sed 's/^/::error title=apt::/'; exit 1; }
      - name: extension view model
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          gjs -m ../gnome-extension/tests/test_view.js 2>&1 | tee "$RUNNER_TEMP/gjs.log" || {
            grep -E -i -A2 'fail|error|exception' "$RUNNER_TEMP/gjs.log" | head -10 | sed 's/^/::error title=gjs::/'
            exit 1
          }
          tail -1 "$RUNNER_TEMP/gjs.log" | sed 's/^/::notice title=gjs::/'
      - name: test
        shell: bash
        run: |
          # Failures also become annotations, which can be read without a token.
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            grep -E -- '^[[:space:]]*(--- FAIL|panic:)|_test\.go:[0-9]+:' "$RUNNER_TEMP/test.log" |
              head -10 | sed -E 's/^[[:space:]]*/::error title=go test::/'
            exit 1
          }
      - name: patched systray copy
        # third_party/systray must be upstream v1.12.2 (hash checked against
        # the checksum database) plus exactly third_party/systray.patch; its
        # own tests (a separate module, not in ./...) run too. Upstream's
        # tests start the tray, which needs a session bus.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash tools/systray-patch.sh
          cd third_party/systray
          if command -v dbus-run-session >/dev/null; then
            dbus-run-session -- go test -race -count=1 ./...
          else
            echo "::notice title=systray::no dbus-run-session; only the patch tests run"
            go test -race -count=1 -run 'TestPropSpec|TestIntrospection|TestNativeStart|TestNativeEnd' ./...
          fi
      - name: patched systray copy (tray icon size)
        # The tray must load the ICO entry of the notification area's size
        # (third_party/systray/trayicon). Upstream's own Windows
        # test does not compile, so only this package runs here.
        if: runner.os == 'Windows'
        shell: bash
        working-directory: agent/third_party/systray
        run: |
          set -o pipefail
          go test -count=1 -v ./trayicon/ 2>&1 | tee "$RUNNER_TEMP/trayicon.log" || {
            grep -E -- '^[[:space:]]*(--- FAIL|panic:)|_test\.go:[0-9]+:' "$RUNNER_TEMP/trayicon.log" |
              head -10 | sed -E 's/^[[:space:]]*/::error title=trayicon::/'
            exit 1
          }
          grep -E 'Size [0-9]+x[0-9]+' "$RUNNER_TEMP/trayicon.log" | head -1 | sed -E 's/^[[:space:]]*/::notice title=trayicon::/'
      - name: keychain integration
        if: runner.os == 'macOS' && hashFiles('agent/internal/creds/keychain_darwin_test.go') != ''
        env:
          AI_USAGE_KEYCHAIN_TEST: "1"
        run: go test -count=1 -run TestKeychainIntegration -v ./internal/creds/

  # The release build on every push: the same files a tag would publish,
  # with the publish step as a dry run.
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.0-ci

  # A release-style build: tools/build.sh, as a release builds, under a
  # release-like version (any version but 0.0.0-ci behaves as a release:
  # no test switch, nothing refused) that can never be released (its
  # "relcheck" part; tools/version.sh). For the release check's rehearsal
  # and for the checks that a released agent never starts the Codex CLI
  # (release.no_codex_cli, Linux and Windows).
  build-relcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.v.outputs.version }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # the compiler and cache setting of build.yml (a release build)
          go-version: "1.27.4"
          cache: false
      - id: v
        run: echo "version=0.8.99-relcheck" >> "$GITHUB_OUTPUT"
      - name: build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: tools/build.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relcheck-files
          path: |
            agent/dist/ai-usage-linux-amd64
            agent/dist/ai-usage-windows-amd64.exe
            agent/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # The release workflow's check, on the release-style files (and the CI
  # build must fail it), so a broken check shows up before a tag exists.
  release-check:
    needs: [build, build-relcheck]
    uses: ./.github/workflows/release-check.yml
    with:
      version: ${{ needs.build-relcheck.outputs.version }}
      artifact: relcheck-files
      rehearsal: true

  # Install, run, upgrade and uninstall on each runner against a fake team
  # server, with the files the build made. Results are annotations.
  install-linux:
    needs: [build, build-relcheck]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relcheck-files
          path: relcheck
      - name: fake server, tray host, vendors and codex
        working-directory: agent
        run: |
          go build -o "$RUNNER_TEMP/bin/fakeserver" ./tools/fakeserver
          go build -o "$RUNNER_TEMP/bin/fakewatcher" ./tools/fakewatcher
          go build -o "$RUNNER_TEMP/bin/fakevendor" ./tools/fakevendor
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/fakecodex" ./tools/fakecodex
      - name: checks
        env:
          CI_DIST: ${{ github.workspace }}/dist
          CI_REL: ${{ github.workspace }}/relcheck
          CI_REL_VERSION: ${{ needs.build-relcheck.outputs.version }}
          CI_BIN: ${{ runner.temp }}/bin
          CI_SCRIPTS: ${{ github.workspace }}/agent/ci
          RUNNER_LABEL: ${{ matrix.os }}
        run: bash agent/ci/check-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-${{ matrix.os }}
          path: out/
          if-no-files-found: warn
          retention-days: 7

  install-macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: fake server
        working-directory: agent
        run: go build -o "$RUNNER_TEMP/bin/fakeserver" ./tools/fakeserver
      - name: checks
        env:
          CI_DIST: ${{ github.workspace }}/dist
          CI_BIN: ${{ runner.temp }}/bin
          CI_SCRIPTS: ${{ github.workspace }}/agent/ci
          RUNNER_LABEL: ${{ matrix.os }}
        run: bash agent/ci/check-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-${{ matrix.os }}
          path: out/
          if-no-files-found: warn
          retention-days: 7

  install-windows:
    needs: [build, build-relcheck]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            desktop: "true"
          - os: windows-11-arm
            desktop: "false"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relcheck-files
          path: relcheck
      - name: fake server, vendors and codex
        working-directory: agent
        run: |
          go build -o "$env:RUNNER_TEMP/bin/fakeserver.exe" ./tools/fakeserver
          go build -o "$env:RUNNER_TEMP/bin/fakevendor.exe" ./tools/fakevendor
          $env:CGO_ENABLED = '0'
          go build -o "$env:RUNNER_TEMP/bin/fakecodex.exe" ./tools/fakecodex
      - name: checks
        env:
          CI_DIST: ${{ github.workspace }}\dist
          CI_REL: ${{ github.workspace }}\relcheck
          CI_REL_VERSION: ${{ needs.build-relcheck.outputs.version }}
          CI_BIN: ${{ runner.temp }}\bin
          CI_SCRIPTS: ${{ github.workspace }}\agent\ci
          CI_DESKTOP: ${{ matrix.desktop }}
        run: ./agent/ci/check-windows.ps1 -Desktop:($env:CI_DESKTOP -eq 'true')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-${{ matrix.os }}
          path: out/
          if-no-files-found: warn
          retention-days: 7
