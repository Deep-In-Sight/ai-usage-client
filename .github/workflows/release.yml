name: release

# A v* tag on a commit of main publishes a GitHub Release with the three
# files and SHA256SUMS. A manual run builds the same files and only prints
# what it would publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            if ! printf '%s\n' "$tag" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
              echo "::error title=release::tag $tag is not vMAJOR.MINOR.PATCH[-pre]"
              exit 1
            fi
            # a test build's version (0.0.0-ci and the like) is never released
            . agent/tools/version.sh
            if ! release_version "${tag#v}"; then
              echo "::error title=release::tag $tag is the version of a test build"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error title=release::tag $tag is not on a commit of main"
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  # The files about to be published: each reports exactly the release's
  # version, and a run of it with every CI test switch set honours none of
  # them (Linux and Windows). ci.yml runs the same workflow on every push
  # on files built the same way (rehearsal), so it is never first run here.
  check:
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    uses: ./.github/workflows/release-check.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      artifact: release-files
      rehearsal: false

  publish:
    needs: [meta, build, check]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: agent/tools/publish-release.sh dist "$GITHUB_REF_NAME"
